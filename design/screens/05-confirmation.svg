<?xml version="1.0" encoding="UTF-8"?>
<!--
  House3 — Booking confirmation (mobile 360x552).

  Answers one question properly: what did I pay, and what was each line for. The
  itemisation is repeated in full, the total is stated once, and the reference is
  shown for quoting over the phone.

  A previous version had a second card — "Where the money went" — showing the
  operator's share and House3's share. It has been removed: the guest does not
  need our internal split, and showing it invites a conversation about margin
  instead of about the stay. The split still happens; it is just not displayed.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="552" viewBox="0 0 360 552"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="360" height="552" fill="#F4F7F9"/>

  <!-- confirmed mark -->
  <circle cx="180" cy="88" r="30" fill="#E9F7F0"/>
  <circle cx="180" cy="88" r="21" fill="#128A4E"/>
  <path d="M170 88 L177 95 L191 80" stroke="#FFFFFF" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <text x="180" y="150" font-size="22" font-weight="600" fill="#10161A" text-anchor="middle">Booking confirmed</text>
  <text x="180" y="174" font-size="13" fill="#6B7A85" text-anchor="middle">H3-LA-303785EA · 2 nights · 25–27 Sep 2026</text>
  <text x="180" y="192" font-size="13" fill="#3A4750" text-anchor="middle">2-Bedroom Apartment, Lekki Phase 1</text>

  <!-- ==== what you were charged ==== -->
  <rect x="16" y="212" width="328" height="222" rx="12" fill="#FFFFFF" stroke="#E4EAEE" stroke-width="1"/>
  <text x="32" y="244" font-size="18" font-weight="600" fill="#10161A">What you were charged</text>

  <text x="32" y="278" font-size="15" fill="#10161A">2 nights × ₦150,000</text>
  <text x="328" y="278" font-size="15" fill="#10161A" text-anchor="end">₦300,000.00</text>
  <text x="32" y="302" font-size="15" fill="#10161A">Cleaning &amp; turnover</text>
  <text x="328" y="302" font-size="15" fill="#10161A" text-anchor="end">₦10,000.00</text>
  <text x="32" y="326" font-size="15" fill="#10161A">House3 service fee (12%)</text>
  <text x="328" y="326" font-size="15" fill="#10161A" text-anchor="end">₦36,000.00</text>
  <text x="32" y="349" font-size="13" fill="#3A4750">VAT on service fee (7.5%)</text>
  <text x="328" y="349" font-size="13" fill="#3A4750" text-anchor="end">₦2,700.00</text>

  <line x1="32" y1="362" x2="328" y2="362" stroke="#AEBBC4" stroke-width="1"/>
  <text x="32" y="386" font-size="15" font-weight="600" fill="#10161A">Total charged</text>
  <text x="328" y="386" font-size="15" font-weight="600" fill="#10161A" text-anchor="end">₦348,700.00</text>

  <text x="32" y="410" font-size="11" fill="#6B7A85">One payment, taken once. Your host is settled</text>
  <text x="32" y="424" font-size="11" fill="#6B7A85">directly — House3 does not hold their money.</text>

  <!-- secondary action -->
  <rect x="16" y="462" width="328" height="48" rx="8" fill="#FFFFFF" stroke="#128A4E" stroke-width="1"/>
  <text x="180" y="492" font-size="15" font-weight="600" fill="#0A6136" text-anchor="middle">Message your host</text>
</svg>
