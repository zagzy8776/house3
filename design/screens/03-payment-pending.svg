<?xml version="1.0" encoding="UTF-8"?>
<!--
  House3 — Payment pending (mobile 360x720).

  This is the Nigeria-specific screen most teams forget. Bank transfer takes
  minutes and USSD sessions time out with no reliable client callback, so this is
  a screen a guest genuinely sits on, not a spinner.

  Decisions encoded here:
   - The reference is large and copyable. Guests read it out over the phone to
     the bank or to support.
   - The recipient is named next to the amount. Guests have been trained by
     fraud to distrust a bare amount, so "Paying: House3 (shortlet booking)"
     does real work.
   - The hold timer is stated calmly, because it is real.
   - Polling happens with backoff in the app; this frame gives the guest
     something to do meanwhile instead of staring at a spinner on 3G.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="360" height="720" fill="#F4F7F9"/>

  <text x="16" y="48" font-size="22" font-weight="600" fill="#10161A">Complete your payment</text>
  <text x="16" y="72" font-size="13" fill="#8A5A12">Room held for 11:04 &#8212; pays and confirms automatically</text>

  <!-- ==== amount + reference ==== -->
  <rect x="16" y="92" width="328" height="136" rx="12" fill="#FFFFFF" stroke="#E4EAEE" stroke-width="1"/>
  <text x="32" y="122" font-size="13" fill="#6B7A85">Amount to pay</text>
  <text x="32" y="160" font-size="28" font-weight="600" fill="#10161A">₦348,700.00</text>
  <line x1="32" y1="176" x2="328" y2="176" stroke="#E4EAEE" stroke-width="1"/>
  <text x="32" y="200" font-size="13" fill="#3A4750">Paying <tspan font-weight="600">House3</tspan> · shortlet booking</text>
  <text x="32" y="218" font-size="13" fill="#3A4750">Reference H3-LA-303785EA</text>
  <text x="328" y="218" font-size="13" font-weight="600" fill="#0A6136" text-anchor="end">Copy</text>

  <!-- ==== payment methods ==== -->
  <rect x="16" y="252" width="328" height="232" rx="12" fill="#FFFFFF" stroke="#E4EAEE" stroke-width="1"/>
  <text x="32" y="284" font-size="18" font-weight="600" fill="#10161A">Choose how to pay</text>

  <circle cx="42" cy="316" r="8" fill="#FFFFFF" stroke="#128A4E" stroke-width="2"/>
  <circle cx="42" cy="316" r="4" fill="#128A4E"/>
  <text x="64" y="312" font-size="15" font-weight="500" fill="#10161A">Card</text>
  <text x="64" y="331" font-size="13" fill="#6B7A85">Visa, Mastercard, Verve</text>
  <line x1="32" y1="348" x2="328" y2="348" stroke="#E4EAEE" stroke-width="1"/>

  <circle cx="42" cy="374" r="8" fill="#FFFFFF" stroke="#AEBBC4" stroke-width="1.5"/>
  <text x="64" y="370" font-size="15" fill="#10161A">Bank transfer</text>
  <text x="64" y="389" font-size="13" fill="#6B7A85">Any Nigerian bank app</text>
  <line x1="32" y1="406" x2="328" y2="406" stroke="#E4EAEE" stroke-width="1"/>

  <circle cx="42" cy="432" r="8" fill="#FFFFFF" stroke="#AEBBC4" stroke-width="1.5"/>
  <text x="64" y="428" font-size="15" fill="#10161A">USSD</text>
  <text x="64" y="447" font-size="13" fill="#6B7A85">*737# and other bank codes</text>

  <!-- ==== where the money goes ==== -->
  <text x="16" y="512" font-size="11" fill="#6B7A85">You pay on Paystack&#8217;s secure page. House3 never sees your</text>
  <text x="16" y="526" font-size="11" fill="#6B7A85">card details, and Lekki Homes Ltd is paid directly.</text>

  <rect x="16" y="550" width="328" height="48" rx="8" fill="#128A4E"/>
  <text x="180" y="580" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Open Paystack to pay ₦348,700</text>

  <rect x="16" y="610" width="328" height="48" rx="8" fill="#FFFFFF" stroke="#128A4E" stroke-width="1"/>
  <text x="180" y="640" font-size="15" font-weight="600" fill="#0A6136" text-anchor="middle">I have paid &#8212; check my booking</text>

  <text x="180" y="686" font-size="13" fill="#6B7A85" text-anchor="middle">Stuck? Call 0700-HOUSE3 and quote your reference</text>
</svg>
