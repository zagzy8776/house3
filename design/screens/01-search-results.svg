<?xml version="1.0" encoding="UTF-8"?>
<!--
  House3 — Search results (mobile 360x808, the Nigerian Android baseline).

  Figma: drag this file onto a canvas. Figma imports SVG as editable vector
  layers, so each rect/text becomes a normal layer. Then bind the fills to your
  imported Variables (Tokens Studio) so the frame and the code share one source.

  The money table is the point of this screen: the operator's own rate, our fee
  and VAT are three separate rows. Nothing is struck through or hidden.

  The numbers below are the real output of src/domain/pricing.ts against the
  Lagos policy (12% fee, 7.5% VAT, NGN 50 rounding) and the demo inventory.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="808" viewBox="0 0 360 808"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="360" height="808" fill="#F4F7F9"/>

  <!-- header -->
  <text x="16" y="48" font-size="22" font-weight="600" fill="#063C22">House3</text>
  <rect x="102" y="28" width="122" height="20" rx="10" fill="#E9F7F0"/>
  <text x="112" y="42" font-size="11" font-weight="500" fill="#0A6136">Lagos · 3 stays live</text>

  <text x="16" y="74" font-size="13" fill="#3A4750">Every price is itemised: the operator&#8217;s own rate,</text>
  <text x="16" y="90" font-size="13" fill="#3A4750">our service fee, and VAT on that fee.</text>

  <!-- search summary -->
  <rect x="16" y="106" width="328" height="56" rx="8" fill="#FFFFFF" stroke="#E4EAEE" stroke-width="1"/>
  <text x="28" y="132" font-size="13" font-weight="500" fill="#10161A">Lekki Phase 1</text>
  <text x="28" y="150" font-size="13" fill="#6B7A85">25 Sep &#8211; 27 Sep · 2 guests</text>
  <text x="328" y="150" font-size="13" font-weight="600" fill="#0A6136" text-anchor="end">Change</text>

  <!-- ==== result card 1 ==== -->
  <rect x="16" y="176" width="328" height="364" rx="12" fill="#FFFFFF" stroke="#E4EAEE" stroke-width="1"/>

  <text x="32" y="208" font-size="18" font-weight="600" fill="#10161A">2-Bedroom Apartment,</text>
  <text x="32" y="230" font-size="18" font-weight="600" fill="#10161A">Lekki Phase 1</text>
  <text x="32" y="256" font-size="13" fill="#6B7A85">2 bed · 2 bath · sleeps 4 · min 1 night</text>

  <!-- operator attribution: the guest always knows whose home this is -->
  <circle cx="34" cy="271" r="5" fill="#128A4E"/>
  <path d="M31.6 271 L33.2 272.7 L36.6 269.2" stroke="#FFFFFF" stroke-width="1.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="45" y="276" font-size="13" fill="#3A4750">Operated by <tspan font-weight="600">Lekki Homes Ltd</tspan></text>

  <line x1="32" y1="296" x2="328" y2="296" stroke="#E4EAEE" stroke-width="1"/>

  <!-- money table: operator rate, then our fee, then VAT -->
  <text x="32" y="322" font-size="15" fill="#10161A">2 nights × ₦150,000</text>
  <text x="328" y="322" font-size="15" fill="#10161A" text-anchor="end">₦300,000.00</text>

  <text x="32" y="346" font-size="15" fill="#10161A">Cleaning &amp; turnover</text>
  <text x="328" y="346" font-size="15" fill="#10161A" text-anchor="end">₦10,000.00</text>

  <text x="32" y="370" font-size="15" fill="#10161A">House3 service fee (12%)</text>
  <text x="328" y="370" font-size="15" fill="#10161A" text-anchor="end">₦36,000.00</text>

  <text x="32" y="393" font-size="13" fill="#3A4750">VAT on service fee (7.5%)</text>
  <text x="328" y="393" font-size="13" fill="#3A4750" text-anchor="end">₦2,700.00</text>

  <line x1="32" y1="406" x2="328" y2="406" stroke="#AEBBC4" stroke-width="1"/>

  <text x="32" y="430" font-size="15" font-weight="600" fill="#10161A">Total to pay now</text>
  <text x="328" y="430" font-size="15" font-weight="600" fill="#10161A" text-anchor="end">₦348,700.00</text>

  <!-- radical transparency line -->
  <text x="32" y="452" font-size="11" fill="#6B7A85">Lekki Homes Ltd receives ₦310,000 · House3 keeps</text>
  <text x="32" y="466" font-size="11" fill="#6B7A85">₦36,700 after payment processing</text>

  <rect x="32" y="480" width="296" height="48" rx="8" fill="#128A4E"/>
  <text x="180" y="510" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Reserve for 15 min</text>

  <!-- ==== result card 2 (partially scrolled into view) ==== -->
  <rect x="16" y="556" width="328" height="236" rx="12" fill="#FFFFFF" stroke="#E4EAEE" stroke-width="1"/>
  <text x="32" y="588" font-size="18" font-weight="600" fill="#10161A">Serviced Studio, Lekki</text>
  <text x="32" y="610" font-size="13" fill="#6B7A85">1 bed · 1 bath · sleeps 2 · min 2 nights</text>
  <circle cx="34" cy="625" r="5" fill="#128A4E"/>
  <path d="M31.6 625 L33.2 626.7 L36.6 623.2" stroke="#FFFFFF" stroke-width="1.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="45" y="630" font-size="13" fill="#3A4750">Operated by <tspan font-weight="600">Lekki Homes Ltd</tspan></text>
  <line x1="32" y1="648" x2="328" y2="648" stroke="#E4EAEE" stroke-width="1"/>

  <text x="32" y="672" font-size="15" fill="#10161A">2 nights × ₦85,000</text>
  <text x="328" y="672" font-size="15" fill="#10161A" text-anchor="end">₦170,000.00</text>
  <text x="32" y="696" font-size="15" fill="#10161A">Cleaning &amp; turnover</text>
  <text x="328" y="696" font-size="15" fill="#10161A" text-anchor="end">₦5,000.00</text>
  <text x="32" y="720" font-size="15" fill="#10161A">House3 service fee (12%)</text>
  <text x="328" y="720" font-size="15" fill="#10161A" text-anchor="end">₦20,400.00</text>
  <text x="32" y="743" font-size="13" fill="#3A4750">VAT on service fee (7.5%)</text>
  <text x="328" y="743" font-size="13" fill="#3A4750" text-anchor="end">₦1,550.00</text>
  <line x1="32" y1="756" x2="328" y2="756" stroke="#AEBBC4" stroke-width="1"/>
  <text x="32" y="780" font-size="15" font-weight="600" fill="#10161A">Total to pay now</text>
  <text x="328" y="780" font-size="15" font-weight="600" fill="#10161A" text-anchor="end">₦196,950.00</text>
</svg>
